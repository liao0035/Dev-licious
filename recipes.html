<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="content-security-policy" content="default-src 'self';
  style-src 'self' 'unsafe-inline' fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://unpkg.com;
  font-src 'self' https://fonts.gstatic.com https://unpkg.com;
  img-src 'self' data: dummyjson.com cdn.dummyjson.com;
  connect-src 'self' dummyjson.com  https://unpkg.com;
  ">

  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet" />
  <!-- google icon -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Ionicons  -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- style sheet -->
  <link rel="stylesheet" href="./css/main.css" />
  <script src="./js/main.js" type="module"></script>

  <title>Recipes</title>
</head>

<body id="recipes">
  <ul class="skip-links" id="page">
    <li>
      <a class="skip-links__link" href="#nav">Skip to main navigation</a>
    </li>
    <li>
      <a class="skip-links__link" href="#main">Skip to main content</a>
    </li>
  </ul>

  <header class="navbar">
    <div class="container">
      <div class="navbar__headline">
        <a class="navbar__logo" href="/">
          Dev-licious
        </a>
      </div>

      <nav id="nav" class="navbar__nav">
        <ul class="navbar__list">
          <li><a class="navbar__link" href="./recipes.html">Recipes</a></li>
          <li><a class="navbar__link" href="./blog.html">Blog</a></li>

          <!-- input search -->
          <li>
            <form action="./recipes.html" method="get" class="navbar__form" id="search-form">
              <div class="input-container">
                <label for="search" class="srt">Search</label>
                <input type="search" id="search" name="search" required />
                <button type="submit" class="submitbtn">
                  <i class="material-symbols-outlined">search</i>
                </button>

              </div>
            </form>
          </li>


        </ul>
      </nav>

      <button class="toggle" data-target="nav" aria-label="toggle">
        <span class="toggle__line toggle__line--top"></span>
        <span class="toggle__line toggle__line--middle"></span>
        <span class="toggle__line toggle__line--bottom"></span>
      </button>

    </div>
  </header>

  <main id="main">

    <!-- card group -->
    <section class="card-group" id="resources" tabindex="0">
      <div class="container">

        <div class="card-group__page">
          <h1 class="card-group__title">Recipes</h1>
          <form action="./recipes.html" id="filter-form">
            <input type="hidden" value="" name="search" id="filter-input">
            <ul class="card-group__filter">
              <!-- meal type -->
              <li class="card-filter__unit">
                <label for="mealType">Meal Type:</label>
                <select id="mealType" name="mealType">
                  <option value="All">All</option>
                  <option value="Breakfast">Breakfast</option>
                  <option value="Lunch">Lunch</option>
                  <option value="Dinner">Dinner</option>
                  <option value="Dessert">Dessert</option>
                  <option value="Snack">Snack</option>
                </select>
              </li>
              <!-- sort by -->
              <li class="card-filter__unit">
                <label for="sortBy">Sort By:</label>
                <select id="sortBy" name="sortBy">
                  <option value="topRate">Top Rated</option>
                  <option value="name">Name</option>
                </select>
              </li>
            </ul>
          </form>
        </div>

        <ul class="card-group__list" role="list">
          <!-- insert js template -->
        </ul>

        <div class="pagination">
          <a href="#" class="pre">&laquo; Previous</a>
          <a href="#" class="next">Next &raquo; </a>
        </div>
      </div>

    </section>


  </main>

  <footer class="footer">
    <div class="container">
      <a class="footer__logo" href="index.html" target="_blank">
        <h2>Dev-Licious</h2>
      </a>

      <div class="footer__nav">
        <ul class="footer__list">
          <li><a href="#" class="footer__link">Receipts</a></li>
          <li><a href="#" class="footer__link">Blog</a></li>
        </ul>
      </div>

      <div class="footer__link-group">

        <h4>Follow <a href="#" class="footer__logo">Dev-Licious</a> </h4>


        <ul>
          <li>
            <a href="#" class="footer__link"><ion-icon name="logo-instagram" size="large"></ion-icon></a>
          </li>
          <li>
            <a href="#" class="footer__link"><ion-icon name="logo-xing" size="large"></ion-icon></a>
          </li>
          <li>
            <a href="#" class="footer__link"><ion-icon name="logo-youtube" size="large"></ion-icon></a>
          </li>
        </ul>
      </div>

    </div>

    <div class="footer__copyright">
      <small> &copy 2024 Dev-licious Inc.
        All Rights Reserved.
        <a href="#">Terms of Service.</a> </small>
    </div>

  </footer>

  <!-- to top -->
  <a href="#page" class="to-top">To Top</a>
  <div class="click-to-close" data-toggle="nav"></div>

  <!-- JS template for card -->
  <template id="card-group__template">
    <li class="col">
      <a class="card" href="#" aria-label="click here to single recipe page">
        <img class="card__img" alt="A random cat!" />
        <div class="card__content">
          <h3 class="card__title"></h3>

          <p class="card__rating">
            <i class="material-symbols-outlined"></i>
          </p>

          <p class="card__meal-type">
            <i class="material-symbols-outlined"></i>
          </p>

          <p class="card__tag">
            <i class="material-symbols-outlined"></i>
          </p>
          <a href="#" class="card__btn" aria-label="click here to single recipe page"><span class="srt">Learn More</span></a>
        </div>
      </a>
    </li>
  </template>

</body>

</html>
