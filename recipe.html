  <!-- template for recipe.js -->
  <template id="singleRecipe__template">
    <div class="single-recipe__img">
      <img src="#" alt="#">
    </div>

    <div class="single-recipe__grid">
      <div class="single-recipe__content">
        <h1 class="single-recipe__title"></h1>
        <p class="single-recipe__description"></p>
        <p class="single-recipe__tags">
          <i class="material-symbols-outlined">tag</i>
        </p>
      </div>

      <div class="single-recipe__info-group">
        <h2 class="single-recipe__subtitle">Recipe Info</h2>

        <div class="single-recipe__info">

          <p class="single-recipe__serving">
            <i class="material-symbols-outlined">restaurant</i>
          </p>

          <p class="single-recipe__time">
            <i class="material-symbols-outlined">schedule</i>
          </p>

          <p class="single-recipe__difficulty">
            <i class="material-symbols-outlined">psychology_alt</i>
          </p>

          <p class="single-recipe__rate">
            <i class="material-symbols-outlined">star</i>
          </p>

        </div>

      </div>
    </div>

    <div class="single-recipe__ingredients">
      <h2 class="single-recipe__subtitle">Ingredients</h2>
      <ul>
        <!-- <li></li> -->

      <ul>

      </ul>

          </p>
          <p class="card__tag">
            <i class="material-symbols-outlined"></i>
          </p>
          <a href="#" class="card__btn" aria-label="click here to single recipe page"><span class="srt">Learn More</span></a>
